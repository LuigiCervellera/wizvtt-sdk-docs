name: System Verification & Security Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit-and-build:
    name: Validate Submission & Type Safety
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: 🛡️ Security & Schema Pattern Audit
        run: node scripts/validate-systems.mjs

      - name: 🔬 TypeScript Compilation Check
        run: npm run build
